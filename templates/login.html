<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaEdge — Login</title>
<style>
:root{
  --bg:#05080f;--bg2:#090d18;--bg3:#0d1220;--panel:#0a0f1c;
  --border:#162035;--bord2:#1e2f48;
  --cyan:#00d4ff;--green:#00e87a;--red:#ff3355;--yellow:#ffc200;
  --text:#dde6f0;--text2:#7090b0;--text3:#354d68;
  --mono:'Courier New',Courier,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:13px;
  height:100%;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* Animated grid background */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:400px;padding:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--bord2);
  border-radius:3px;
  padding:36px 32px 32px;
  box-shadow:0 0 60px rgba(0,212,255,.06), 0 0 120px rgba(0,0,0,.8);
}

.logo{
  text-align:center;margin-bottom:28px;
}
.logo-icon{
  font-size:28px;display:block;margin-bottom:8px;
  text-shadow:0 0 30px rgba(0,212,255,.5);
}
.logo-title{
  font-size:16px;font-weight:bold;color:var(--cyan);
  letter-spacing:4px;text-transform:uppercase;
  text-shadow:0 0 20px rgba(0,212,255,.3);
}
.logo-sub{
  font-size:8px;letter-spacing:2px;color:var(--text3);
  margin-top:4px;text-transform:uppercase;
}

.divider{
  border:none;border-top:1px solid var(--border);margin:0 0 24px;
}

label{
  display:block;color:var(--text3);font-size:8px;
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;
}

input[type=text], input[type=password]{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:13px;
  padding:9px 11px;border-radius:2px;outline:none;
  transition:border-color .15s;
}
input[type=text]:focus, input[type=password]:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(0,212,255,.15);
}

.field{margin-bottom:16px}

.btn-login{
  width:100%;background:transparent;border:1px solid var(--cyan);
  color:var(--cyan);font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;
  padding:10px;cursor:pointer;border-radius:2px;
  transition:all .2s;margin-top:6px;
}
.btn-login:hover{
  background:rgba(0,212,255,.08);
  box-shadow:0 0 20px rgba(0,212,255,.12);
}

.error{
  background:rgba(255,51,85,.08);border:1px solid rgba(255,51,85,.3);
  color:var(--red);font-size:10px;padding:8px 10px;
  border-radius:2px;margin-bottom:16px;
  letter-spacing:.5px;
}

.footer{
  text-align:center;margin-top:20px;
  color:var(--text3);font-size:8px;letter-spacing:1px;
}

/* Blinking cursor effect on title */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cursor{animation:blink 1s infinite;color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <span class="logo-icon" style="font-size:22px;font-weight:900;font-family:'Courier New',monospace;color:var(--cyan);text-shadow:0 0 30px rgba(0,212,255,.6);">α</span>
      <div class="logo-title">Alpha<span style="color:var(--text)">Edge</span><span class="cursor">_</span></div>
      <div class="logo-sub">AI-Powered Quant Research Platform</div>
    </div>
    <hr class="divider">

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label>Uporabniško ime</label>
        <input type="text" name="username" autocomplete="username"
               autofocus placeholder="admin" required>
      </div>
      <div class="field">
        <label>Geslo</label>
        <input type="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">▶ PRIJAVA</button>
    </form>

    <div class="footer">
      ALPHAEDGE v2.0 · SECURE · AUTHORIZED USERS ONLY
    </div>
    <div style="text-align:center;margin-top:10px">
      <a href="/" style="color:var(--text3);font-size:8px;letter-spacing:1px;text-decoration:none;">← Back to alphaedge.io</a>
    </div>
  </div>
</div>
</body>
</html>
